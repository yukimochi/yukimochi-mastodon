version: 2.1

# Minor versions are pinned here on purpose. Only the patch component is
# resolved automatically by .circleci/resolve-versions.sh before each build.
# Bump these when moving to a new minor release.
#   RUBY_MINOR     -> Dockerfile ARG RUBY_VERSION
#   NODE_MAJOR     -> Dockerfile / streaming/Dockerfile ARG NODE_MAJOR_VERSION
#   VIPS_MINOR     -> Dockerfile ARG VIPS_VERSION
#   FFMPEG_MINOR   -> Dockerfile ARG FFMPEG_VERSION
#   DEBIAN_VERSION -> Dockerfile / streaming/Dockerfile ARG DEBIAN_VERSION
commands:
  resolve-versions:
    steps:
      - run:
          name: Resolve latest patch versions
          command: |
            RUBY_MINOR=4.0 \
            NODE_MAJOR=24 \
            VIPS_MINOR=8.18 \
            FFMPEG_MINOR=9.0 \
            DEBIAN_VERSION=trixie \
            bash .circleci/resolve-versions.sh >> "$BASH_ENV"

jobs:
  build-ruby:
    docker:
     - image: cimg/base:current
    resource_class: large
    steps:
      - checkout
      - setup_remote_docker
      - resolve-versions
      - run: |
          TAG=circleci-<< pipeline.number >>
          echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker build -f Dockerfile \
            --build-arg RUBY_VERSION="$RUBY_VERSION" \
            --build-arg NODE_MAJOR_VERSION="$NODE_MAJOR_VERSION" \
            --build-arg DEBIAN_VERSION="$DEBIAN_VERSION" \
            --build-arg VIPS_VERSION="$VIPS_VERSION" \
            --build-arg FFMPEG_VERSION="$FFMPEG_VERSION" \
            -t $DOCKERHUB_USERNAME/mastodon:$TAG .
          docker push $DOCKERHUB_USERNAME/mastodon:$TAG
          docker run --name public_asset $DOCKERHUB_USERNAME/mastodon:$TAG tini --version
          docker cp public_asset:/opt/mastodon/public .
          docker build -f Dockerfile.proxy -t $DOCKERHUB_USERNAME/mastodon-proxy:$TAG .
          docker push $DOCKERHUB_USERNAME/mastodon-proxy:$TAG

  build-streaming:
    docker:
     - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - resolve-versions
      - run: |
          TAG=circleci-<< pipeline.number >>
          echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker build -f streaming/Dockerfile \
            --build-arg NODE_MAJOR_VERSION="$NODE_MAJOR_VERSION" \
            --build-arg DEBIAN_VERSION="$DEBIAN_VERSION" \
            -t $DOCKERHUB_USERNAME/mastodon-streaming:$TAG .
          docker push $DOCKERHUB_USERNAME/mastodon-streaming:$TAG

workflows:
  version: 2
  build:
    jobs:
      - build-ruby:
          filters:
            branches:
              only: production
      - build-streaming:
          filters:
            branches:
              only: production
